name: CI

# Lightweight sanity checks on every push/PR — this project has no
# automated test suite yet, so this catches what it actually can: the
# frontend failing to type-check/build, and the backend failing to
# import (syntax errors, broken imports).

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - working-directory: frontend
        run: |
          npm ci
          npm run build

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: server
        run: |
          pip install -r requirements.txt
          python -m compileall -q app
          python -c "import app.main"
