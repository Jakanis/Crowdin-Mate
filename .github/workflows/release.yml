name: Build release binaries

# Runs on any tag starting with "v" (e.g. v0.1.0) and attaches the
# packaged Windows exe + Linux binary to that tag's GitHub Release.
# workflow_dispatch is there so a build can be re-run by hand (e.g. to
# retry a flaky runner) without pushing a new tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Archives, not bare executables: the build is one-folder (see
    # desktop.spec on why that's required, not cosmetic), so each platform
    # ships its folder packed in whatever that platform extracts without
    # extra tools. It also avoids Edge blocking a bare .exe download with
    # "isn't commonly downloaded".
    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: Crowdin-Mate-Windows.zip
          - os: ubuntu-latest
            asset_name: Crowdin-Mate-Linux.tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Qt's bundled runtime (see desktop.py/desktop.spec on why Qt over
      # GTK) still needs a handful of low-level system libraries present
      # for its X11/XCB platform plugin, NSS (used by QtWebEngine's
      # embedded Chromium), and ALSA — confirmed by actually launching
      # the built binary under WSLg: without these it either won't
      # start at all (missing libsmime3.so/libasound.so.2) or the
      # window silently never appears (missing libxcb-* pulled in by
      # libqxcb.so). All of these are near-universal on any real desktop
      # Linux install; it's specifically bare CI/container images that
      # strip them.
      - name: Install Linux Qt runtime libs
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1 libxkbcommon0 libxkbcommon-x11-0 fontconfig \
            libxcb-cursor0 libxcb-icccm4 libxcb-xkb1 libxcb-keysyms1 \
            libxcb-shape0 libxcb-xinerama0 libxcb-render-util0 libxcb-image0 \
            libnss3 libasound2t64

      - name: Install backend dependencies
        working-directory: server
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable
        working-directory: server
        run: pyinstaller desktop.spec --noconfirm

      # Both archive the "Crowdin Mate" folder ITSELF, not its contents, so
      # extracting can't scatter files into whatever directory someone
      # happened to be in.
      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path "server/dist/Crowdin Mate" -DestinationPath "${{ matrix.asset_name }}"

      # tar rather than zip on Linux specifically to carry the executable
      # bit — a zip would drop it and leave people running chmod first.
      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: tar -czf "${{ matrix.asset_name }}" -C server/dist "Crowdin Mate"

      # Published alongside each archive so anyone can check that what they
      # downloaded is byte-for-byte what this workflow produced from the
      # tagged source. That matters most on Windows, where an unsigned build
      # draws warnings from SmartScreen and can draw a heuristic malware
      # verdict from Defender (see README) — "is this file actually the
      # release?" should be answerable without taking anyone's word for it.
      - name: Checksum
        shell: bash
        run: sha256sum "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
